<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Метеостанция</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<section id="current-block" th:hidden="${last == null}">
    <h1>Текущие показания</h1>
    <div class="current">
        <div class="value">
            <span class="label">Температура</span>
            <span class="number" id="current-temperature"
                  th:text="${last != null ? #numbers.formatDecimal(last.temperature, 1, 1) + ' °C' : '—'}">—</span>
        </div>
        <div class="value">
            <span class="label">Влажность</span>
            <span class="number" id="current-humidity"
                  th:text="${last != null ? #numbers.formatDecimal(last.humidity, 1, 1) + ' %' : '—'}">—</span>
        </div>
        <div class="value">
            <span class="label">Устройство</span>
            <span id="current-device" th:text="${last != null ? last.deviceId : '—'}">—</span>
        </div>
        <div class="value">
            <span class="label">Последнее измерение</span>
            <span id="current-time"
                  th:text="${last != null ? #temporals.format(last.receivedAt.atZone(zoneId), 'dd.MM.yyyy HH:mm:ss') : '—'}">—</span>
        </div>
    </div>
</section>

<p class="empty" id="no-data" th:hidden="${last != null}">Данных пока нет.</p>

<section>
    <h1>Изменения за сегодня</h1>
    <div class="charts">
        <div class="chart-wrap">
            <canvas id="chart-temperature"></canvas>
        </div>
        <div class="chart-wrap">
            <canvas id="chart-humidity"></canvas>
        </div>
    </div>
    <p class="empty" id="chart-empty" hidden>Данных пока нет.</p>
</section>

<section>
    <h2>Последние измерения</h2>
    <table id="measurements-table" th:hidden="${#lists.isEmpty(measurements)}">
        <thead>
        <tr>
            <th>Время</th>
            <th>Устройство</th>
            <th>Температура, °C</th>
            <th>Влажность, %</th>
        </tr>
        </thead>
        <tbody id="measurements-body">
        <tr th:each="m : ${measurements}">
            <td th:text="${#temporals.format(m.receivedAt.atZone(zoneId), 'dd.MM.yyyy HH:mm:ss')}"></td>
            <td th:text="${m.deviceId}"></td>
            <td th:text="${#numbers.formatDecimal(m.temperature, 1, 1)}"></td>
            <td th:text="${#numbers.formatDecimal(m.humidity, 1, 1)}"></td>
        </tr>
        </tbody>
    </table>
    <p class="empty" id="measurements-empty" th:hidden="${!#lists.isEmpty(measurements)}">Данных пока нет.</p>
</section>

<script th:src="@{/js/chart.umd.min.js}"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
